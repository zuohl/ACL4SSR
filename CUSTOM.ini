[custom]
;不要随意改变关键字，否则会导致出错
;acl4SSR规则

;去广告：支持
;自动测速：支持
;微软分流：不支持
;苹果分流：不支持
;增强中国IP段：不支持
;增强国外GFW：不支持

ruleset=🎯 全球直连,clash-classic:https://cdn.jsdelivr.net/gh/zuohl/ACL4SSR@main/LocalAreaNetwork.yaml,86400
ruleset=🛑 全球拦截,[]GEOSITE,category-ads-all
ruleset=🛑 全球拦截,clash-domain:https://cdn.uura.cn/AWAvenue/AWAvenue-Ads-Rule-Clash-Classical.yaml,86400
ruleset=💧 纯净代理,clash-domain:https://raw.githubusercontent.com/zuohl/ACL4SSR/main/Clean.yaml,86400
ruleset=🎯 全球直连,[]GEOSITE,CN
ruleset=🎯 全球直连,[]GEOIP,CN
ruleset=🚀 节点选择,[]FINAL

custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]🔍 手动选择`[]🧼 纯净节点池`[]DIRECT
custom_proxy_group=🔍 手动选择`select`(?!clean).*
custom_proxy_group=♻️ 自动选择`url-test`(?!clean).*`https://www.google.com/generate_204`300,300,200
custom_proxy_group=🧼 纯净节点池`select`clean-
custom_proxy_group=💧 纯净代理`select`[]♻️ 自动选择`[]🔍 手动选择`[]🧼 纯净节点池
custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]♻️ 自动选择
custom_proxy_group=🛑 全球拦截`select`[]REJECT`[]DIRECT
enable_rule_generator=true
overwrite_original_rules=true
